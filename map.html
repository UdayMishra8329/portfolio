<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Viewer | Uday Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .project-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px 20px; }
    .back-btn { position: absolute; top: 30px; left: 40px; color: var(--accent-secondary); text-decoration: none; font-family: var(--font-mono); font-weight: bold; z-index: 1001; font-size: 1.2rem; }
    .back-btn:hover { text-shadow: 0 0 10px var(--accent-secondary); }
    .map-frame { width: 100%; height: 350px; border: none; border-radius: 12px; filter: invert(90%) hue-rotate(180deg) contrast(120%); transition: filter 0.5s; }
  </style>
</head>
<body class="vanta-bg">
  <div id="vanta-canvas" style="position: fixed; inset: 0; z-index: -1;"></div>
  
  <a href="index.html" class="back-btn">← Back to Portfolio</a>
  
  <div class="project-container">
    <div class="glass-card" style="padding: 2rem; width: 100%; max-width: 800px; text-align: center;" data-tilt data-tilt-glare data-tilt-max-glare="0.2">
      <h2 style="font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 1rem; color: var(--accent);">Interactive Map</h2>
      <p style="color: #aaa; margin-bottom: 20px; font-family: var(--font-mono);">Night-themed map visualization using CSS filters.</p>
      
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="text" id="mapSearch" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: white; font-family: var(--font-mono); font-size: 1rem;" placeholder="Search city or place..." onkeyup="if(event.key === 'Enter') updateMap()">
        <button class="btn-glow" style="border: none; padding: 0 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;" onclick="updateMap()">🔍</button>
      </div>

      <!-- Google Maps iframe -->
      <iframe id="mapFrame" class="map-frame" src="https://maps.google.com/maps?q=New%20York&t=&z=13&ie=UTF8&iwloc=&output=embed" allowfullscreen></iframe>
      
      <div style="margin-top: 15px;">
        <a id="externalMapLink" href="https://maps.google.com/maps?q=New%20York" target="_blank" class="btn-glow" style="display: inline-block; padding: 10px 20px; font-size: 0.9rem;">View Full Map ↗</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    if (window.VANTA) VANTA.NET({ el: "#vanta-canvas", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200.00, minWidth: 200.00, scale: 1.00, scaleMobile: 1.00, color: 0xbc13fe, backgroundColor: 0x060608, points: 10.00, maxDistance: 20.00, spacing: 20.00 });

    function updateMap() {
      const q = document.getElementById('mapSearch').value;
      if(!q) return;
      const iframe = document.getElementById('mapFrame');
      const link = document.getElementById('externalMapLink');
      const encoded = encodeURIComponent(q);
      iframe.src = `https://maps.google.com/maps?q=${encoded}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
      link.href = `https://maps.google.com/maps?q=${encoded}`;
    }
  </script>
</body>
</html>
