<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindrome Checker | Uday Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .project-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px 20px; }
    .back-btn { position: absolute; top: 30px; left: 40px; color: var(--accent-secondary); text-decoration: none; font-family: var(--font-mono); font-weight: bold; z-index: 1001; font-size: 1.2rem; }
    .back-btn:hover { text-shadow: 0 0 10px var(--accent-secondary); }
    .app-input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: white; font-size: 1.2rem; margin-bottom: 20px; text-align: center; }
    .app-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 15px rgba(188, 19, 254, 0.3); }
    .result-box { margin-top: 30px; font-size: 1.5rem; font-family: var(--font-mono); min-height: 35px; padding: 15px; border-radius: 8px; transition: 0.3s; }
    .success { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid rgba(0,255,136,0.3); }
    .error { background: rgba(255,51,102,0.1); color: #ff3366; border: 1px solid rgba(255,51,102,0.3); }
  </style>
</head>
<body class="vanta-bg">
  <div id="vanta-canvas" style="position: fixed; inset: 0; z-index: -1;"></div>
  
  <a href="index.html" class="back-btn">← Back to Portfolio</a>
  
  <div class="project-container">
    <div class="glass-card" style="padding: 3rem; width: 100%; max-width: 500px; text-align: center;" data-tilt data-tilt-glare data-tilt-max-glare="0.2">
      <h2 style="font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 2rem; color: var(--accent);">Palindrome<br>Checker</h2>
      <p style="color: #aaa; margin-bottom: 20px;">Enter a word or phrase to see if it reads the same backwards.</p>
      
      <input type="text" id="word" class="app-input" placeholder="e.g. Racecar or Madam..." onkeyup="if(event.key === 'Enter') checkPalindrome()">
      <button class="btn-glow" style="width: 100%; border: none; cursor: pointer; display: block;" onclick="checkPalindrome()">Check Now</button>
      
      <div id="pal-result" class="result-box" style="opacity: 0;"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    if (window.VANTA) VANTA.NET({ el: "#vanta-canvas", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200.00, minWidth: 200.00, scale: 1.00, scaleMobile: 1.00, color: 0xbc13fe, backgroundColor: 0x060608, points: 10.00, maxDistance: 20.00, spacing: 20.00 });
    
    function checkPalindrome() {
      const raw = document.getElementById('word').value;
      const str = raw.toLowerCase().replace(/[^a-z0-9]/g, '');
      const res = document.getElementById('pal-result');
      
      if(!str) {
        res.style.opacity = '1';
        res.innerText = 'Please enter some text!';
        res.className = 'result-box error';
        return;
      }
      
      const isPal = str === str.split('').reverse().join('');
      res.style.opacity = '0';
      
      setTimeout(() => {
        if(isPal) { 
          res.innerHTML = `<strong>Yes!</strong> "${raw}" is a palindrome.`; 
          res.className = 'result-box success'; 
        } else { 
          res.innerHTML = `<strong>No,</strong> "${raw}" is not a palindrome.`; 
          res.className = 'result-box error'; 
        }
        res.style.opacity = '1';
      }, 100);
    }
  </script>
</body>
</html>
