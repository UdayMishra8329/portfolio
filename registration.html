<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration | Uday Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .project-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px 20px; }
    .back-btn { position: absolute; top: 30px; left: 40px; color: var(--accent-secondary); text-decoration: none; font-family: var(--font-mono); font-weight: bold; z-index: 1001; font-size: 1.2rem; }
    .back-btn:hover { text-shadow: 0 0 10px var(--accent-secondary); }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; margin-bottom: 8px; font-family: var(--font-mono); font-size: 0.9rem; color: #ccc; }
    .input-group input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: white; font-family: var(--font-pari); font-size: 1rem; transition: 0.3s; }
    .input-group input:focus { outline: none; border-color: var(--accent-secondary); box-shadow: 0 0 10px rgba(0,240,255,0.2); }
    .submit-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; background: var(--text-color); color: var(--bg-color); font-family: var(--font-mono); font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; text-transform: uppercase; }
    .submit-btn:hover { box-shadow: 0 0 20px rgba(255,255,255,0.4); transform: translateY(-2px); }
    .name-row { display: flex; gap: 15px; }
    .name-row .input-group { flex: 1; }
    #msg { margin-top: 20px; font-family: var(--font-mono); font-size: 0.9rem; min-height: 20px; }
  </style>
</head>
<body class="vanta-bg">
  <div id="vanta-canvas" style="position: fixed; inset: 0; z-index: -1;"></div>
  
  <a href="index.html" class="back-btn">← Back to Portfolio</a>
  
  <div class="project-container">
    <div class="glass-card" style="padding: 2.5rem; width: 100%; max-width: 500px; text-align: center;" data-tilt data-tilt-glare data-tilt-max-glare="0.2">
      <h2 style="font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 1.5rem; color: var(--accent);">Create Account</h2>
      
      <form id="regForm" onsubmit="handleRegistration(event)">
        <div class="name-row">
          <div class="input-group">
            <label>First Name</label>
            <input type="text" required placeholder="John">
          </div>
          <div class="input-group">
            <label>Last Name</label>
            <input type="text" required placeholder="Doe">
          </div>
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" required placeholder="john@example.com">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="p1" required placeholder="••••••••">
        </div>
        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="p2" required placeholder="••••••••">
        </div>
        <button type="submit" class="submit-btn" id="regBtn">Register</button>
        <div id="msg"></div>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    if (window.VANTA) VANTA.NET({ el: "#vanta-canvas", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200.00, minWidth: 200.00, scale: 1.00, scaleMobile: 1.00, color: 0xbc13fe, backgroundColor: 0x060608, points: 10.00, maxDistance: 20.00, spacing: 20.00 });
    
    function handleRegistration(e) {
      e.preventDefault();
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      const msg = document.getElementById('msg');
      
      if(p1 !== p2) {
        msg.innerText = '❌ Passwords do not match!';
        msg.style.color = '#ff3366';
        return;
      }
      
      const btn = document.getElementById('regBtn');
      btn.innerHTML = 'Creating...';
      msg.innerText = '';
      
      setTimeout(() => {
        msg.innerHTML = '🎉 Account created successfully!';
        msg.style.color = '#00ff88';
        btn.innerHTML = 'Register';
        document.getElementById('regForm').reset();
      }, 1500);
    }
  </script>
</body>
</html>
