<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Themes | Uday Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .project-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px 20px; transition: background 0.5s ease; }
    .back-btn { position: absolute; top: 30px; left: 40px; color: var(--accent-secondary); text-decoration: none; font-family: var(--font-mono); font-weight: bold; z-index: 1001; font-size: 1.2rem; }
    .back-btn:hover { text-shadow: 0 0 10px var(--accent-secondary); }
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .theme-btn { padding: 20px; border-radius: 12px; border: 2px solid transparent; font-family: var(--font-mono); font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
    /* Visual representation of themes */
    .t-cyber { background: linear-gradient(45deg, #060608, #1a1a2e); border-color: #bc13fe; }
    .t-ocean { background: linear-gradient(45deg, #0f2027, #203a43); border-color: #00f0ff; }
    .t-matrix { background: linear-gradient(45deg, #0d1110, #14281d); border-color: #00ff88; }
    .t-fire { background: linear-gradient(45deg, #1b0000, #3d0000); border-color: #ff3366; }
    
    .theme-btn.active { box-shadow: 0 0 20px rgba(255,255,255,0.3); transform: scale(1.05); }
    .theme-btn:hover { transform: translateY(-5px); }
  </style>
</head>
<body class="vanta-bg">
  <div id="vanta-canvas" style="position: fixed; inset: 0; z-index: -1;"></div>
  
  <a href="index.html" class="back-btn" id="bBtn">← Back to Portfolio</a>
  
  <div class="project-container">
    <div class="glass-card" style="padding: 3rem; width: 100%; max-width: 600px; text-align: center;" data-tilt data-tilt-glare data-tilt-max-glare="0.2">
      <h2 style="font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 1rem; color: var(--accent);" id="tTitle">Theme Switcher</h2>
      <p style="color: #ccc; font-size: 1.1rem; margin-bottom: 2rem;">Watch the aesthetic transform in real-time.</p>
      
      <div class="theme-grid">
        <button class="theme-btn t-cyber active" onclick="setTheme('cyber', this)">🟣 Cyber</button>
        <button class="theme-btn t-ocean" onclick="setTheme('ocean', this)">🔵 Ocean</button>
        <button class="theme-btn t-matrix" onclick="setTheme('matrix', this)">🟢 Matrix</button>
        <button class="theme-btn t-fire" onclick="setTheme('fire', this)">🔴 Fire</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    let vantaEffect;
    
    function initVanta(primary, bg) {
      if(vantaEffect) vantaEffect.destroy();
      if(window.VANTA) {
        vantaEffect = VANTA.NET({ el: "#vanta-canvas", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200.00, minWidth: 200.00, scale: 1.00, scaleMobile: 1.00, color: primary, backgroundColor: bg, points: 10.00, maxDistance: 20.00, spacing: 20.00 });
      }
    }

    const themes = {
      cyber: { p: '#bc13fe', s: '#00f0ff', bg: '#060608', hexP: 0xbc13fe, hexB: 0x060608 },
      ocean: { p: '#00ccff', s: '#00ffcc', bg: '#0f2027', hexP: 0x00ccff, hexB: 0x0f2027 },
      matrix: { p: '#00ff88', s: '#005500', bg: '#0d1110', hexP: 0x00ff88, hexB: 0x0d1110 },
      fire: { p: '#ff3366', s: '#ff9900', bg: '#1b0000', hexP: 0xff3366, hexB: 0x1b0000 }
    };
    
    // Load existing theme if any
    let currentTheme = localStorage.getItem('portfolioTheme') || 'cyber';
    const initT = themes[currentTheme];
    if(currentTheme !== 'cyber') {
      const r = document.documentElement;
      r.style.setProperty('--accent', initT.p);
      r.style.setProperty('--accent-secondary', initT.s);
      r.style.setProperty('--bg-color', initT.bg);
      document.getElementById('tTitle').style.color = initT.p;
      document.getElementById('bBtn').style.color = initT.s;
    }
    
    // Set active button
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.remove('active');
      if (b.classList.contains(`t-${currentTheme}`)) b.classList.add('active');
    });

    // Init default
    initVanta(initT.hexP, initT.hexB);

    function setTheme(name, btn) {
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      const r = document.documentElement;
      const t = themes[name];
      
      r.style.setProperty('--accent', t.p);
      r.style.setProperty('--accent-secondary', t.s);
      r.style.setProperty('--bg-color', t.bg);
      
      // Update local overrides just for visual effect
      document.getElementById('tTitle').style.color = t.p;
      document.getElementById('bBtn').style.color = t.s;
      
      initVanta(t.hexP, t.hexB);
      
      // Save globally
      localStorage.setItem('portfolioTheme', name);
    }
  </script>
</body>
</html>
