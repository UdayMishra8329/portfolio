<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Uday Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .project-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px 20px; }
    .back-btn { position: absolute; top: 30px; left: 40px; color: var(--accent-secondary); text-decoration: none; font-family: var(--font-mono); font-weight: bold; z-index: 1001; font-size: 1.2rem; }
    .back-btn:hover { text-shadow: 0 0 10px var(--accent-secondary); }
    .input-group { margin-bottom: 25px; text-align: left; }
    .input-group label { display: block; margin-bottom: 8px; font-family: var(--font-mono); font-size: 0.9rem; color: #ccc; }
    .input-group input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: white; font-family: var(--font-pari); font-size: 1.1rem; transition: 0.3s; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
    .input-group input:focus { outline: none; border-color: var(--accent-secondary); box-shadow: 0 0 10px rgba(0,240,255,0.2), inset 0 2px 5px rgba(0,0,0,0.5); }
    .submit-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; background: var(--text-color); color: var(--bg-color); font-family: var(--font-mono); font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; text-transform: uppercase; }
    .submit-btn:hover { box-shadow: 0 0 20px rgba(255,255,255,0.4); transform: translateY(-2px); }
    #msg { margin-top: 20px; font-family: var(--font-mono); font-size: 0.9rem; color: #00f0ff; min-height: 20px; }
  </style>
</head>
<body class="vanta-bg">
  <div id="vanta-canvas" style="position: fixed; inset: 0; z-index: -1;"></div>
  
  <a href="index.html" class="back-btn">← Back to Portfolio</a>
  
  <div class="project-container">
    <div class="glass-card" style="padding: 3rem; width: 100%; max-width: 450px; text-align: center;" data-tilt data-tilt-glare data-tilt-max-glare="0.2">
      <h2 style="font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 2rem; color: var(--accent);">Secure Login</h2>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>Username or Email</label>
          <input type="text" id="username" required placeholder="Enter your email">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="submit-btn" id="loginBtn">Sign In</button>
        <div id="msg"></div>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    if (window.VANTA) VANTA.NET({ el: "#vanta-canvas", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200.00, minWidth: 200.00, scale: 1.00, scaleMobile: 1.00, color: 0xbc13fe, backgroundColor: 0x060608, points: 10.00, maxDistance: 20.00, spacing: 20.00 });
    
    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const msg = document.getElementById('msg');
      btn.innerHTML = 'Authenticating...';
      btn.style.opacity = '0.7';
      msg.innerText = '';
      
      setTimeout(() => {
        msg.innerHTML = '✅ Login successful! Welcome back.';
        msg.style.color = '#00ff88';
        btn.innerHTML = 'Sign In';
        btn.style.opacity = '1';
        document.getElementById('loginForm').reset();
      }, 1500);
    }
  </script>
</body>
</html>
